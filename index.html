<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUND — A Game of Submission</title>
<style>
  /* ============================================================
     ROOT VARIABLES & RESET
  ============================================================ */
  :root {
    --bg-primary: #1a0a2e;
    --bg-secondary: #2d1b4e;
    --bg-card: #3d2060;
    --bg-card-light: #4a2875;
    --gold: #c9a84c;
    --gold-light: #e8c96e;
    --gold-dark: #8b6914;
    --crimson: #8b1a3a;
    --crimson-light: #c2245a;
    --crimson-dark: #5a0f24;
    --velvet: #6b2d6b;
    --velvet-light: #9b4d9b;
    --text-primary: #f0e6d3;
    --text-secondary: #c9a84c;
    --text-muted: #9b8aad;
    --border: #6b2d6b;
    --border-gold: #c9a84c;
    --success: #4a9b6b;
    --danger: #c2245a;
    --shadow: 0 4px 20px rgba(0,0,0,0.5);
    --shadow-gold: 0 0 20px rgba(201,168,76,0.3);
    --transition: all 0.3s ease;
    --font-main: 'Georgia', serif;
    --font-accent: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-primary);
    background-image:
      radial-gradient(ellipse at top, #2d1b4e 0%, #1a0a2e 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236b2d6b' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    color: var(--text-primary);
    font-family: var(--font-main);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ============================================================
     TYPOGRAPHY
  ============================================================ */
  h1, h2, h3, h4 {
    font-family: var(--font-accent);
    letter-spacing: 2px;
  }

  .title-main {
    font-size: 3.5rem;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.5), 2px 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 8px;
    text-transform: uppercase;
  }

  .title-sub {
    font-size: 1rem;
    color: var(--text-muted);
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .section-title {
    font-size: 1.4rem;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--gold-dark);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  /* ============================================================
     PAGES
  ============================================================ */
  .page {
    display: none;
    min-height: 100vh;
    padding: 20px;
  }

  .page.active { display: block; }

  /* ============================================================
     CARDS & CONTAINERS
  ============================================================ */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .card-light {
    background: var(--bg-card-light);
    border-color: var(--gold-dark);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .flex { display: flex; }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .gap-8 { gap: 8px; }
  .gap-16 { gap: 16px; }
  .gap-20 { gap: 20px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .mb-32 { margin-bottom: 32px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .text-center { text-align: center; }
  .text-gold { color: var(--gold); }
  .text-crimson { color: var(--crimson-light); }
  .text-muted { color: var(--text-muted); }
  .text-small { font-size: 0.85rem; }
  .w-full { width: 100%; }

  /* ============================================================
     BUTTONS
  ============================================================ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-accent);
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-dark));
    color: var(--bg-primary);
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(201,168,76,0.4);
  }

  .btn-primary:hover {
    box-shadow: 0 4px 25px rgba(201,168,76,0.6);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--gold-dark);
    color: var(--gold);
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
  }

  .btn-danger {
    background: linear-gradient(135deg, var(--crimson-dark), var(--crimson), var(--crimson-dark));
    color: var(--text-primary);
    box-shadow: 0 4px 15px rgba(194,36,90,0.4);
  }

  .btn-success {
    background: linear-gradient(135deg, #2d6b4a, var(--success), #2d6b4a);
    color: var(--text-primary);
    box-shadow: 0 4px 15px rgba(74,155,107,0.4);
  }

  .btn-velvet {
    background: linear-gradient(135deg, #4a1f4a, var(--velvet), #4a1f4a);
    color: var(--text-primary);
    box-shadow: 0 4px 15px rgba(107,45,107,0.4);
  }

  .btn-sm { padding: 6px 14px; font-size: 0.78rem; letter-spacing: 1px; }
  .btn-lg { padding: 16px 36px; font-size: 1.1rem; letter-spacing: 3px; }
  .btn-icon { padding: 8px; min-width: 36px; border-radius: 4px; }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* ============================================================
     FORM ELEMENTS
  ============================================================ */
  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-input, .form-select {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text-primary);
    font-family: var(--font-main);
    font-size: 0.95rem;
    transition: var(--transition);
  }

  .form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(201,168,76,0.2);
  }

  .form-select option { background: var(--bg-secondary); }

  /* ============================================================
     TOGGLE SWITCHES
  ============================================================ */
  .toggle-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-secondary);
    border-radius: 6px;
    border: 1px solid var(--border);
    transition: var(--transition);
    margin-bottom: 6px;
  }

  .toggle-wrap:hover { border-color: var(--gold-dark); }

  .toggle-label { font-size: 0.9rem; flex: 1; margin-right: 8px; }

  .toggle {
    position: relative;
    width: 48px;
    height: 24px;
    flex-shrink: 0;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--bg-card);
    border-radius: 24px;
    border: 1px solid var(--border);
    transition: var(--transition);
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: var(--transition);
  }

  .toggle input:checked + .toggle-slider {
    background: var(--gold-dark);
    border-color: var(--gold);
  }

  .toggle input:checked + .toggle-slider::before {
    transform: translateX(24px);
    background: var(--gold);
  }

  /* ============================================================
     TAGS / CHIPS
  ============================================================ */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 1px;
    border: 1px solid;
  }

  .tag-gold { background: rgba(201,168,76,0.15); border-color: var(--gold-dark); color: var(--gold); }
  .tag-velvet { background: rgba(107,45,107,0.2); border-color: var(--velvet); color: var(--velvet-light); }
  .tag-crimson { background: rgba(139,26,58,0.2); border-color: var(--crimson); color: var(--crimson-light); }

  .tag-delete {
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
    font-size: 0.9rem;
    line-height: 1;
  }

  .tag-delete:hover { opacity: 1; }

  /* ============================================================
     DIVIDERS
  ============================================================ */
  .divider {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 20px 0;
  }

  .divider-gold {
    background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
  }

  /* ============================================================
     SCROLL
  ============================================================ */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--velvet); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

  /* ============================================================
     PAGE 1 — SPLASH
  ============================================================ */
  #page-splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }

  .splash-ornament {
    font-size: 3rem;
    margin-bottom: 16px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .splash-warning {
    background: rgba(139,26,58,0.2);
    border: 1px solid var(--crimson);
    border-radius: 8px;
    padding: 16px 24px;
    max-width: 600px;
    margin: 24px auto;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  /* ============================================================
     PAGE 2 — SETUP
  ============================================================ */
  .setup-header {
    text-align: center;
    padding: 30px 20px 20px;
  }

  .setup-nav {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .setup-tab {
    padding: 8px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    transition: var(--transition);
  }

  .setup-tab.active {
    background: var(--bg-card);
    border-color: var(--gold);
    color: var(--gold);
  }

  .setup-tab:hover:not(.active) {
    border-color: var(--border-gold);
    color: var(--text-secondary);
  }

  .setup-panel { display: none; }
  .setup-panel.active { display: block; }

  .setup-container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

  /* Player cards */
  .player-setup-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    transition: var(--transition);
  }

  .player-setup-card:hover { border-color: var(--gold-dark); }

  .player-number {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--gold-dark);
    color: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* Inventory items */
  .inventory-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-secondary);
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    transition: var(--transition);
  }

  .inventory-item:hover { border-color: var(--gold-dark); }

  .inventory-item-name { font-size: 0.9rem; flex: 1; }

  .inventory-actions { display: flex; gap: 4px; }

  /* ============================================================
     PAGE 3 — GAME
  ============================================================ */
  .game-header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .game-logo {
    font-family: var(--font-accent);
    font-size: 1.2rem;
    color: var(--gold);
    letter-spacing: 4px;
  }

  .round-indicator {
    background: var(--bg-card);
    border: 1px solid var(--gold-dark);
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 2px;
  }

  /* Score display */
  .score-display {
    display: flex;
    gap: 12px;
  }

  .score-player {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
    min-width: 120px;
    transition: var(--transition);
  }

  .score-player.is-master {
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
  }

  .score-player.is-submissive {
    border-color: var(--crimson);
    box-shadow: 0 0 15px rgba(194,36,90,0.3);
  }

  .score-player-name {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .score-player-score {
    font-size: 1.8rem;
    color: var(--gold);
    font-weight: bold;
    line-height: 1;
  }

  .score-player-role {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .role-master { color: var(--gold); }
  .role-submissive { color: var(--crimson-light); }

  /* Cards display */
  .card-holder {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .game-card {
    width: 48px;
    height: 64px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    cursor: pointer;
    transition: var(--transition);
    border: 2px solid;
    position: relative;
    overflow: hidden;
  }

  .game-card.red-card {
    background: linear-gradient(135deg, #5a0f24, var(--crimson));
    border-color: var(--crimson-light);
    box-shadow: 0 0 12px rgba(194,36,90,0.4);
  }

  .game-card.yellow-card {
    background: linear-gradient(135deg, #6b5000, var(--gold));
    border-color: var(--gold-light);
    box-shadow: 0 0 12px rgba(201,168,76,0.4);
  }

  .game-card.used {
    opacity: 0.3;
    cursor: not-allowed;
    filter: grayscale(0.7);
  }

  .game-card:not(.used):hover {
    transform: translateY(-3px) rotate(2deg);
  }

  .game-card-label {
    font-size: 0.6rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: absolute;
    bottom: 4px;
    color: rgba(255,255,255,0.7);
  }

  /* Task display */
  .task-display {
    background: var(--bg-card);
    border: 1px solid var(--gold-dark);
    border-radius: 12px;
    padding: 28px;
    position: relative;
    box-shadow: var(--shadow), var(--shadow-gold);
  }

  .task-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 12px 12px 0 0;
  }

  .task-category-badge {
    display: inline-block;
    padding: 4px 14px;
    background: rgba(201,168,76,0.15);
    border: 1px solid var(--gold-dark);
    border-radius: 20px;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .task-text {
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--text-primary);
  }

  .task-items-used {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* Timer */
  .timer-display {
    text-align: center;
    padding: 20px;
  }

  .timer-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) 0%, transparent 0%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    position: relative;
    box-shadow: 0 0 30px rgba(201,168,76,0.3);
  }

  .timer-circle::before {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--bg-card);
  }

  .timer-inner {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .timer-time {
    font-size: 2rem;
    color: var(--gold);
    font-weight: bold;
    line-height: 1;
  }

  .timer-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Category toggles */
  .category-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
    margin-bottom: 6px;
  }

  .category-toggle.on { border-color: var(--gold-dark); background: rgba(201,168,76,0.05); }
  .category-toggle.off { opacity: 0.5; }

  .category-icon {
    font-size: 1.2rem;
    width: 28px;
    text-align: center;
  }

  /* Game state panels */
  .game-state-idle,
  .game-state-task,
  .game-state-timer,
  .game-state-result,
  .game-state-punishment {
    display: none;
  }

  .game-state-idle.active,
  .game-state-task.active,
  .game-state-timer.active,
  .game-state-result.active,
  .game-state-punishment.active {
    display: block;
  }

  /* Result display */
  .result-banner {
    padding: 24px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 16px;
  }

  .result-success {
    background: rgba(74,155,107,0.15);
    border: 1px solid var(--success);
  }

  .result-fail {
    background: rgba(194,36,90,0.15);
    border: 1px solid var(--crimson);
  }

  .result-icon { font-size: 3rem; margin-bottom: 8px; }

  .result-title {
    font-size: 1.8rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* ============================================================
     MODAL
  ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--gold-dark);
    border-radius: 12px;
    padding: 32px;
    max-width: 600px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), var(--shadow-gold);
    position: relative;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .modal-title {
    font-size: 1.4rem;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
  }

  .modal-close:hover { color: var(--gold); }

  /* ============================================================
     GRAND PRIZE PAGE
  ============================================================ */
  .grand-prize-display {
    background: var(--bg-card);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 32px;
    position: relative;
    box-shadow: 0 0 40px rgba(201,168,76,0.3);
  }

  .grand-prize-display::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px; bottom: -1px;
    border-radius: 12px;
    background: linear-gradient(135deg, transparent 40%, rgba(201,168,76,0.1));
    pointer-events: none;
  }

  .grand-prize-text {
    font-size: 1rem;
    line-height: 2;
    color: var(--text-primary);
  }
