<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet & Vows: The Trial of Submission</title>
    <style>
        :root {
            --velvet: #2d0a31;
            --gold: #d4af37;
            --soft-grey: #e0e0e0;
            --crimson: #800000;
            --text: #f5f5f5;
            --bg-accent: #1a051d;
        .add-controls {
    display: flex;
    gap: 5px;
    margin-top: 10px;
    border-top: 1px solid rgba(212, 175, 55, 0.2);
    padding-top: 10px;
}
.add-controls input {
    flex: 2;
    padding: 5px;
}
.add-controls button {
    flex: 1;
    padding: 5px;
    font-size: 0.8rem;
}
        }

        body {
            background-color: var(--velvet);
            color: var(--text);
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, var(--velvet) 0%, var(--bg-accent) 100%);
        }

        #game-container {
            width: 95%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        h1, h2, h3 { color: var(--gold); text-align: center; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; }

        .screen { display: none; animation: fadeIn 0.8s ease-in; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 20px; }
        
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid var(--gold);
            background: #121212;
            color: white;
            font-size: 1rem;
        }

        button {
            background: linear-gradient(to bottom, var(--gold), #b38f00);
            color: var(--velvet);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        button:hover { background: #fff; transform: scale(1.02); }

        .inventory-section {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
        }

        .card-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid white;
        }

        .yellow-card { background: #ffd700; color: #000; }
        .red-card { background: #cc0000; color: #fff; }

        #task-display {
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-left: 4px solid var(--gold);
            font-size: 1.2rem;
            line-height: 1.8;
            margin: 25px 0;
            color: #ddd;
        }

        .timer { font-size: 3rem; text-align: center; color: var(--gold); font-family: monospace; }

        .safe-word-btn {
            background: var(--crimson);
            color: white;
            margin-top: 40px;
            opacity: 0.7;
        }

        .safe-word-btn:hover { background: red; opacity: 1; }

        label { font-size: 0.9rem; color: var(--gold); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen" class="screen active">
        <h1>Velvet & Vows</h1>
        <p style="text-align:center; font-style:italic;">Consenting Adults & RACK Principles Only</p>
        
        <div class="setup-grid">
            <div>
                <h3>Dominant</h3>
                <input type="text" id="p1-name" placeholder="Name/Title">
                <select id="p1-gender">
                    <option value="Male">Masculine</option>
                    <option value="Female">Feminine</option>
                    <option value="Neutral">Neutral</option>
                </select>
            </div>
            <div>
                <h3>Submissive</h3>
                <input type="text" id="p2-name" placeholder="Name/Title">
                <select id="p2-gender">
                    <option value="Female">Feminine</option>
                    <option value="Male">Masculine</option>
                    <option value="Neutral">Neutral</option>
                </select>
            </div>
        </div>

        <div class="inventory-section">
            <h3>The Arsenal & Fetishes</h3>
            <div id="master-list-ui"></div>
        </div>

        <label>Game Length (Rounds):</label>
        <input type="number" id="game-rounds" value="20" min="1">

        <button onclick="initGame()">Commence the Trial</button>
    </div>

    <div id="game-screen" class="screen">
        <div style="display:flex; justify-content:space-between; color:var(--gold);">
            <div id="ui-p1-score"></div>
            <div id="ui-round-num">Round 1</div>
            <div id="ui-p2-score"></div>
        </div>

        <h2 id="role-call"></h2>
        
        <div id="card-area" class="card-box"></div>

        <div id="master-panel">
            <h3>Master's Command</h3>
            <div id="category-toggles" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;"></div>
            <button onclick="drawTask()">Generate Command</button>
        </div>

        <div id="task-panel" style="display:none;">
            <div id="task-display"></div>
            <div id="action-buttons">
                <button id="btn-yellow" onclick="handleYellowCard()" style="display:none;">Use Yellow Card (Swap Roles)</button>
                <button id="btn-red" onclick="handleRedCard()" style="display:none;">Use Red Card (New Task)</button>
                <button onclick="vetoCurrentTask()" style="background:#444; color:#fff;">Veto Task (Delete Forever)</button>
                <button id="btn-start-timer" onclick="runTimer()">Start Timer</button>
            </div>
            <div id="timer-box" class="timer" style="display:none;">00:00</div>
            <div id="result-buttons" style="display:none;">
                <button onclick="resolveRound(true)">Task Completed</button>
                <button onclick="resolveRound(false)" style="background:var(--crimson); color:white;">Task Failed</button>
            </div>
        </div>

        <button class="safe-word-btn" onclick="triggerSafeWord()">SAFE WORD (REDCARD)</button>
    </div>

    <div id="final-screen" class="screen">
        <h1>Ultimate Judgment</h1>
        <h2 id="winner-text"></h2>
        <div id="grand-prize-box" style="background:rgba(255,255,255,0.1); padding:20px; border-radius:10px; font-style:italic; line-height:2;"></div>
        <button onclick="location.reload()" style="margin-top:20px;">Return to Shadows (Restart)</button>
    </div>
</div>

<script>
/* 1. DATABASE & CONFIG */
const CATEGORY_NAMES = {
    impact: "The Sting",
    sensation: "The Touch",
    restraints: "Bound",
    gags: "Silence",
    blindfolds: "Shadows",
    toys: "Implements"
};

const TASK_TYPES = [
    "The Weave (Shibari)", "The Unbinding (Escape)", "The Solitary Knot", 
    "The Provocation (Dare)", "The Precipice (Tease)", "The Penance", 
    "The Silk", "The Void (Sensory)"
];

// Initial Data
let inventory = JSON.parse(localStorage.getItem('v_inv')) || {
    "The Sting": ["Leather Flogger", "Bamboo Cane", "Paddle"],
    "The Touch": ["Ice", "Wax Candle", "Wartenberg Wheel"],
    "Bound": ["Jute Rope", "Leather Cuffs", "Zip Ties"],
    "Silence": ["Ball Gag", "Medical Tape", "Ring Gag"],
    "Shadows": ["Silk Scarf", "Leather Hood"],
    "Implements": ["Vibrator", "Glass Dildo", "Clamps"]
};

let fetishes = JSON.parse(localStorage.getItem('v_fetish')) || ["Impact", "Bondage", "Edge Play", "Sensory Deprivation"];
let vetoed = JSON.parse(localStorage.getItem('v_veto')) || [];

// 50 Tasks per Category Logic (Sample placeholders - add more to arrays)
const taskLibrary = {
    "The Weave (Shibari)": [
        "Using the Bound items (Rope), construct a detailed Takate Kote chest harness. The submissive's arms must be pulled tightly behind the back. Once secured, use a second length to tie the ankles together and connect them to the waist cinch in a modified hogtie. The submissive must remain this way, silenced by a Silk Scarf, for 10 minutes.",
        "Bind the submissive's wrists to their own mid-thighs using tight rope wraps. They must remain in a deep squat position while the Master uses The Sting items on their exposed back for 5 minutes."
    ],
    "The Precipice (Tease)": [
        "The Master will use an Implement (Vibrator) on the submissive. Bring them to the edge of climax 3 times. Between each edge, the submissive must endure 1 minute of 'The Touch' (Ice) on the same area. No climax is permitted for penis owners.",
        "The submissive is blindfolded. The Master teases the inner thighs and genitals with oral stimulation but stops the moment the submissive makes a sound. If they moan, they must endure 5 'Sting' strikes."
    ],
    "The Penance": [
        "The submissive must kneel and receive 20 strikes from a 'Sting' item of the Master's choice. After every 5 strikes, the submissive must thank the Master. If they forget, the count restarts.",
        "Position the submissive in a stress position (wall sit). They must hold this for 3 minutes. If they fail, they are bound in 'Silence' gear for the next two rounds."
    ]
};

const grandPrizes = [
    "The Eternal Night: The winner claims total ownership. The loser is stripped and placed in full restraints (The Weave) and silenced (The Silence). The winner will spend the next hour alternating between 'The Silk' (soft touch) and 'The Sting'. The loser is brought to the edge of climax multiple times but only granted release if the winner deems their submission perfect.",
    "The Velvet Throne: The winner relaxes while the loser, bound and blindfolded, must use their mouth and hands to please the winner for 30 minutes. The winner may use any 'Implements' on the loser during this time. The scene ends only when the winner achieves total satisfaction."
];

/* 2. CORE GAME LOGIC */
let state = {
    players: [],
    round: 1,
    maxRounds: 20,
    masterIdx: 0,
    subIdx: 1,
    yellowOwner: null,
    redOwner: null,
    currentTask: null,
    timer: null
};

// Render Inventory UI
function renderSetup() {
    const container = document.getElementById('master-list-ui');
    container.innerHTML = "";
    for(let cat in inventory) {
        let div = document.createElement('div');
        div.className = "inventory-section";
        div.innerHTML = `<strong>${cat}</strong>`;
        inventory[cat].forEach(item => {
            div.innerHTML += `<div class="item-row"><span>${item}</span> <button onclick="deleteItem('${cat}','${item}')" style="width:auto; padding:2px 5px;">X</button></div>`;
        });
        container.appendChild(div);
    }
}

function deleteItem(cat, item) {
    inventory[cat] = inventory[cat].filter(i => i !== item);
    saveData();
    renderSetup();
}

function saveData() {
    localStorage.setItem('v_inv', JSON.stringify(inventory));
    localStorage.setItem('v_veto', JSON.stringify(vetoed));
}

function initGame() {
    state.players = [
        { name: document.getElementById('p1-name').value || "Dom", gender: document.getElementById('p1-gender').value, score: 0 },
        { name: document.getElementById('p2-name').value || "Sub", gender: document.getElementById('p2-gender').value, score: 0 }
    ];
    state.maxRounds = parseInt(document.getElementById('game-rounds').value);
    
    // Randomize initial cards
    state.yellowOwner = Math.random() > 0.5 ? 0 : 1;
    state.redOwner = Math.random() > 0.5 ? 1 - state.yellowOwner : Math.floor(Math.random()*2);
    
    // Randomize roles
    state.masterIdx = Math.floor(Math.random()*2);
    state.subIdx = 1 - state.masterIdx;

    document.getElementById('setup-screen').classList.remove('active');
    document.getElementById('game-screen').classList.add('active');
    
    const toggles = document.getElementById('category-toggles');
    TASK_TYPES.forEach(t => {
        toggles.innerHTML += `<label><input type="checkbox" checked value="${t}"> ${t}</label>`;
    });

    updateUI();
}

function updateUI() {
    document.getElementById('ui-p1-score').innerText = `${state.players[0].name}: ${state.players[0].score}`;
    document.getElementById('ui-p2-score').innerText = `${state.players[1].name}: ${state.players[1].score}`;
    document.getElementById('ui-round-num').innerText = `Trial ${state.round} / ${state.maxRounds}`;
    document.getElementById('role-call').innerText = `Master: ${state.players[state.masterIdx].name} | Sub: ${state.players[state.subIdx].name}`;
    
    let cardHTML = "";
    if(state.yellowOwner !== null) cardHTML += `<div class="card yellow-card">Yellow Card: ${state.players[state.yellowOwner].name}</div>`;
    if(state.redOwner !== null) cardHTML += `<div class="card red-card">Red Card: ${state.players[state.redOwner].name}</div>`;
    document.getElementById('card-area').innerHTML = cardHTML;
}

function drawTask() {
    const checked = Array.from(document.querySelectorAll('#category-toggles input:checked')).map(i => i.value);
    if(checked.length === 0) return alert("Select at least one category.");
    
    const cat = checked[Math.floor(Math.random() * checked.length)];
    const list = taskLibrary[cat] || ["Master, invent a task using 'The Bound' and 'The Silence' items for 5 minutes."];
    
    state.currentTask = list[Math.floor(Math.random() * list.length)];
    
    document.getElementById('task-display').innerText = state.currentTask;
    document.getElementById('task-panel').style.display = 'block';
    document.getElementById('master-panel').style.display = 'none';
    
    // Show/Hide card buttons
    document.getElementById('btn-yellow').style.display = (state.yellowOwner === state.subIdx) ? "block" : "none";
    document.getElementById('btn-red').style.display = (state.redOwner !== null) ? "block" : "none";
}

function runTimer() {
    document.getElementById('btn-start-timer').style.display = 'none';
    document.getElementById('timer-box').style.display = 'block';
    document.getElementById('result-buttons').style.display = 'flex';
    
    let time = 300; 
    state.timer = setInterval(() => {
        time--;
        let m = Math.floor(time/60);
        let s = time%60;
        document.getElementById('timer-box').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        if(time <= 0) clearInterval(state.timer);
    }, 1000);
}

function resolveRound(success) {
    clearInterval(state.timer);
    if(success) {
        state.players[state.subIdx].score++;
        // Swap roles
        [state.masterIdx, state.subIdx] = [state.subIdx, state.masterIdx];
    } else {
        state.players[state.subIdx].score--;
    }

    state.round++;
    if(state.round > state.maxRounds) return endGame();

    // Reset UI for next round
    document.getElementById('task-panel').style.display = 'none';
    document.getElementById('master-panel').style.display = 'block';
    document.getElementById('btn-start-timer').style.display = 'block';
    document.getElementById('timer-box').style.display = 'none';
    document.getElementById('result-buttons').style.display = 'none';
    updateUI();
}

function handleYellowCard() {
    [state.masterIdx, state.subIdx] = [state.subIdx, state.masterIdx];
    state.yellowOwner = 1 - state.yellowOwner; // Pass to other player
    document.getElementById('task-panel').style.display = 'none';
    document.getElementById('master-panel').style.display = 'block';
    updateUI();
}

function handleRedCard() {
    state.redOwner = 1 - state.redOwner; // Pass to other player
    drawTask(); // Draw a new task
}

function triggerSafeWord() {
    alert("SAFE WORD CALLED. Scene stopped.");
    state.players[state.subIdx].score -= 5;
    resolveRound(false);
}

function endGame() {
    document.getElementById('game-screen').classList.remove('active');
    document.getElementById('final-screen').classList.add('active');
    const winner = state.players[0].score > state.players[1].score ? state.players[0] : state.players[1];
    document.getElementById('winner-text').innerText = `${winner.name} is the Supreme Sovereign`;
    document.getElementById('grand-prize-box').innerText = grandPrizes[Math.floor(Math.random()*grandPrizes.length)];
}

renderSetup();
</script>
</body>
</html>
