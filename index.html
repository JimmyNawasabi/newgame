<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet & Gold: A Game of Submission</title>
    <style>
        :root {
            --bg-light: #F4F0F2; /* Light velvet/grey */
            --primary-dark: #4A0E2E; /* Deep Plum/Purple */
            --primary-red: #8B0021; /* Deep Velvet Red */
            --accent-gold: #D4AF37; /* Rich Gold */
            --text-dark: #2A2A2A;
            --text-light: #FFFFFF;
            --card-bg: #FFFFFF;
            --shadow: 0 6px 20px rgba(74, 14, 46, 0.15);
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3, h4 {
            color: var(--primary-dark);
            text-align: center;
            font-weight: normal;
            margin-top: 0;
        }

        h1 {
            font-size: 2.8em;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 10px;
            color: var(--primary-red);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--accent-gold);
            margin-bottom: 20px;
        }

        .hidden { display: none !important; }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #fafafa;
        }

        button {
            background-color: var(--primary-dark);
            color: var(--text-light);
            border: 1px solid var(--accent-gold);
            padding: 12px 20px;
            font-size: 1.1em;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            font-family: inherit;
        }

        button:hover { background-color: var(--primary-red); box-shadow: var(--shadow); }
        button.action-btn { background-color: var(--accent-gold); color: var(--primary-dark); font-weight: bold; }
        button.action-btn:hover { background-color: #e5c158; }
        button.danger { background-color: #8B0000; border-color: #ff4d4d; }
        button.warning { background-color: #DAA520; color: #000; border-color: #000; }
        button.success { background-color: #2E8B57; }
        button.small { padding: 5px 10px; font-size: 0.9em; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        
        .list-section { border: 1px solid #eee; padding: 15px; border-radius: 8px; background: #faf8f9; }
        .list-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }

        .task-box {
            background: #fffafa;
            border-left: 6px solid var(--primary-red);
            padding: 25px;
            margin: 20px 0;
            font-size: 1.25em;
            line-height: 1.6;
            font-style: italic;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background: var(--primary-dark);
            color: var(--accent-gold);
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.3em;
            font-weight: bold;
