<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet & Chain</title>
<style>
  /* ============================================================
     ROOT VARIABLES & RESET
  ============================================================ */
  :root {
    --bg-primary: #1a0a2e;
    --bg-secondary: #2d1454;
    --bg-card: #3a1a6e;
    --bg-card-light: #4a2480;
    --accent-gold: #d4af37;
    --accent-gold-light: #f0d060;
    --accent-rose: #c8506a;
    --accent-rose-light: #e8708a;
    --accent-velvet: #8b3a6b;
    --accent-silver: #c0b8d0;
    --text-primary: #f0e6ff;
    --text-secondary: #c8b8e8;
    --text-muted: #9080b0;
    --text-gold: #d4af37;
    --border-gold: rgba(212,175,55,0.4);
    --border-rose: rgba(200,80,106,0.4);
    --success: #5db87a;
    --danger: #c8506a;
    --warning: #d4af37;
    --shadow-gold: 0 0 20px rgba(212,175,55,0.3);
    --shadow-rose: 0 0 20px rgba(200,80,106,0.3);
    --shadow-purple: 0 0 30px rgba(138,58,107,0.4);
    --font-title: 'Georgia', serif;
    --font-body: 'Trebuchet MS', sans-serif;
    --radius: 12px;
    --radius-sm: 6px;
    --transition: all 0.3s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #1a0a2e 0%, #2d1454 40%, #1a0a2e 100%);
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--text-primary);
    overflow-x: hidden;
  }

  /* ============================================================
     SCROLLBAR
  ============================================================ */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 4px; }

  /* ============================================================
     PAGES
  ============================================================ */
  .page { display: none; min-height: 100vh; padding: 20px; }
  .page.active { display: block; }

  /* ============================================================
     HEADER / LOGO
  ============================================================ */
  .game-header {
    text-align: center;
    padding: 30px 20px 20px;
    position: relative;
  }

  .logo-title {
    font-family: var(--font-title);
    font-size: clamp(2.2rem, 6vw, 4rem);
    background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    filter: drop-shadow(0 0 10px rgba(212,175,55,0.5));
  }

  .logo-subtitle {
    font-size: 0.85rem;
    letter-spacing: 6px;
    color: var(--accent-silver);
    text-transform: uppercase;
    margin-top: 6px;
  }

  .logo-divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    margin: 12px auto;
  }

  /* ============================================================
     CARDS
  ============================================================ */
  .card {
    background: linear-gradient(135deg, rgba(58,26,110,0.9), rgba(45,20,84,0.95));
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-purple), inset 0 1px 0 rgba(212,175,55,0.1);
    backdrop-filter: blur(10px);
  }

  .card-title {
    font-family: var(--font-title);
    font-size: 1.3rem;
    color: var(--accent-gold);
    letter-spacing: 2px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-gold);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title .icon { font-size: 1.2rem; }

  /* ============================================================
     BUTTONS
  ============================================================ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: var(--transition);
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }

  .btn:hover::before { left: 100%; }

  .btn-gold {
    background: linear-gradient(135deg, #b8960a, var(--accent-gold), #d4af37);
    color: #1a0a2e;
    box-shadow: 0 4px 15px rgba(212,175,55,0.4);
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.6); }

  .btn-rose {
    background: linear-gradient(135deg, #a03050, var(--accent-rose), #e8708a);
    color: #fff;
    box-shadow: 0 4px 15px rgba(200,80,106,0.4);
  }
  .btn-rose:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,80,106,0.6); }

  .btn-velvet {
    background: linear-gradient(135deg, #6b2a5b, var(--accent-velvet), #ab5a8b);
    color: #fff;
    box-shadow: 0 4px 15px rgba(139,58,107,0.4);
  }
  .btn-velvet:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139,58,107,0.6); }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-gold);
    color: var(--accent-gold);
  }
  .btn-outline:hover { background: rgba(212,175,55,0.1); border-color: var(--accent-gold); }

  .btn-danger {
    background: linear-gradient(135deg, #8b2030, #c8506a);
    color: #fff;
    box-shadow: 0 4px 15px rgba(200,80,106,0.3);
  }
  .btn-danger:hover { transform: translateY(-2px); }

  .btn-success {
    background: linear-gradient(135deg, #2d7a4a, #5db87a);
    color: #fff;
    box-shadow: 0 4px 15px rgba(93,184,122,0.3);
  }
  .btn-success:hover { transform: translateY(-2px); }

  .btn-sm { padding: 6px 14px; font-size: 0.78rem; }
  .btn-lg { padding: 16px 36px; font-size: 1.05rem; letter-spacing: 2px; }
  .btn-full { width: 100%; }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ============================================================
     FORM ELEMENTS
  ============================================================ */
  .form-group { margin-bottom: 16px; }

  label {
    display: block;
    color: var(--text-secondary);
    font-size: 0.85rem;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    background: rgba(26,10,46,0.8);
    border: 1px solid var(--border-gold);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.9rem;
    transition: var(--transition);
    outline: none;
  }

  input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
    border-color: var(--accent-gold);
    box-shadow: 0 0 10px rgba(212,175,55,0.2);
  }

  select option { background: var(--bg-secondary); }

  /* ============================================================
     TOGGLE SWITCH
  ============================================================ */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(26,10,46,0.5);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    transition: var(--transition);
  }

  .toggle-wrap:hover { border-color: var(--border-gold); background: rgba(26,10,46,0.7); }

  .toggle-wrap .item-name { flex: 1; color: var(--text-primary); font-size: 0.9rem; }
  .toggle-wrap .item-actions { display: flex; gap: 8px; align-items: center; }

  .toggle {
    position: relative;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(100,80,140,0.5);
    border-radius: 12px;
    border: 1px solid rgba(212,175,55,0.3);
    transition: var(--transition);
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 16px; width: 16px;
    left: 4px; bottom: 3px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: var(--transition);
  }

  .toggle input:checked + .toggle-slider { background: linear-gradient(135deg, var(--accent-velvet), var(--accent-rose)); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(22px); background: var(--accent-gold); }

  /* ============================================================
     PLAYER SETUP
  ============================================================ */
  .player-card {
    background: linear-gradient(135deg, rgba(74,36,128,0.6), rgba(45,20,84,0.8));
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    transition: var(--transition);
  }

  .player-card:hover { border-color: var(--accent-gold); box-shadow: var(--shadow-gold); }

  .player-number {
    position: absolute;
    top: -12px; left: 20px;
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
    color: #1a0a2e;
    font-weight: 800;
    font-size: 0.75rem;
    padding: 3px 12px;
    border-radius: 10px;
    letter-spacing: 1px;
  }

  /* ============================================================
     GRID
  ============================================================ */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 600px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* ============================================================
     SETUP TABS
  ============================================================ */
  .tab-nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    background: rgba(26,10,46,0.6);
    padding: 6px;
    border-radius: var(--radius);
    border: 1px solid var(--border-gold);
  }

  .tab-btn {
    flex: 1;
    min-width: 120px;
    padding: 10px 16px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.82rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: var(--transition);
    text-align: center;
  }

  .tab-btn:hover { color: var(--text-secondary); border-color: var(--border-gold); }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent-velvet), var(--accent-rose));
    color: #fff;
    border-color: transparent;
    box-shadow: var(--shadow-rose);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ============================================================
     ADD ITEM ROW
  ============================================================ */
  .add-item-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    align-items: center;
  }

  .add-item-row input { flex: 1; margin: 0; }

  /* ============================================================
     CATEGORY BADGE
  ============================================================ */
  .cat-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ============================================================
     GAME PAGE
  ============================================================ */
  .game-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .game-layout { grid-template-columns: 1fr; }
  }

  .sidebar { position: sticky; top: 20px; height: fit-content; }

  /* ============================================================
     SCORE DISPLAY
  ============================================================ */
  .score-board {
    background: linear-gradient(135deg, rgba(74,36,128,0.8), rgba(45,20,84,0.9));
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow-gold);
  }

  .player-score {
    padding: 14px;
    margin-bottom: 12px;
    border-radius: var(--radius-sm);
    background: rgba(26,10,46,0.5);
    border: 1px solid rgba(212,175,55,0.2);
    transition: var(--transition);
  }

  .player-score.active-role {
    border-color: var(--accent-rose);
    background: rgba(200,80,106,0.1);
    box-shadow: var(--shadow-rose);
  }

  .player-score .p-name {
    font-family: var(--font-title);
    font-size: 1.1rem;
    color: var(--accent-gold);
    margin-bottom: 4px;
  }

  .player-score .p-role {
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .role-master { color: var(--accent-gold); }
  .role-sub { color: var(--accent-rose); }

  .score-num {
    font-size: 2.2rem;
    font-weight: 800;
    font-family: var(--font-title);
    color: var(--text-primary);
  }

  .score-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

  /* ============================================================
     CARDS IN GAME
  ============================================================ */
  .special-card-wrap {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  .special-card {
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    min-width: 100px;
    transition: var(--transition);
    cursor: default;
  }

  .special-card.yellow-card {
    background: linear-gradient(135deg, #b8960a, #f0d060);
    color: #1a0a2e;
    box-shadow: 0 4px 12px rgba(212,175,55,0.4);
  }

  .special-card.red-card {
    background: linear-gradient(135deg, #8b2030, #e8506a);
    color: #fff;
    box-shadow: 0 4px 12px rgba(200,80,106,0.4);
  }

  .special-card.used {
    opacity: 0.3;
    filter: grayscale(80%);
    box-shadow: none;
  }

  .card-holder { font-size: 0.7rem; margin-top: 3px; opacity: 0.8; }

  /* ============================================================
     TASK DISPLAY
  ============================================================ */
  .task-display {
    background: linear-gradient(135deg, rgba(58,26,110,0.95), rgba(45,20,84,0.98));
    border: 2px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow-gold), var(--shadow-purple);
    position: relative;
    overflow: hidden;
  }

  .task-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent-rose), var(--accent-gold), var(--accent-velvet));
  }

  .task-category-label {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    background: linear-gradient(135deg, var(--accent-velvet), var(--accent-rose));
    color: #fff;
  }

  .task-text {
    font-size: 1.0rem;
    line-height: 1.8;
    color: var(--text-primary);
    background: rgba(26,10,46,0.5);
    border-left: 3px solid var(--accent-gold);
    padding: 16px 20px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin: 14px 0;
  }

  .task-assigned {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .assigned-badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .assigned-sub { background: rgba(200,80,106,0.2); border: 1px solid var(--accent-rose); color: var(--accent-rose-light); }
  .assigned-master { background: rgba(212,175,55,0.2); border: 1px solid var(--accent-gold); color: var(--accent-gold-light); }

  /* ============================================================
     TIMER
  ============================================================ */
  .timer-display {
    text-align: center;
    padding: 20px;
    margin: 16px 0;
    background: rgba(26,10,46,0.7);
    border-radius: var(--radius);
    border: 1px solid var(--border-gold);
  }

  .timer-num {
    font-size: 4rem;
    font-weight: 800;
    font-family: var(--font-title);
    color: var(--accent-gold);
    letter-spacing: 4px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(212,175,55,0.5);
    transition: color 0.3s;
  }

  .timer-num.warning { color: var(--accent-rose); text-shadow: 0 0 20px rgba(200,80,106,0.7); }

  .timer-label { font-size: 0.75rem; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

  .timer-bar-wrap {
    height: 6px;
    background: rgba(100,80,140,0.3);
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
  }

  .timer-bar {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-rose), var(--accent-gold));
    transition: width 1s linear, background 0.5s;
  }

  .timer-bar.low { background: linear-gradient(90deg, #8b2030, var(--accent-rose)); }

  /* ============================================================
     TASK ACTION BUTTONS
  ============================================================ */
  .task-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
  }

  /* ============================================================
     ROUND INDICATOR
  ============================================================ */
  .round-indicator {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(26,10,46,0.7);
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }

  .round-num {
    font-family: var(--font-title);
    font-size: 1.4rem;
    color: var(--accent-gold);
  }

  .round-progress {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: 300px;
  }

  .round-pip {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(100,80,140,0.4);
    border: 1px solid rgba(212,175,55,0.2);
    transition: var(--transition);
  }

  .round-pip.done { background: var(--accent-gold); border-color: var(--accent-gold); }
  .round-pip.current { background: var(--accent-rose); border-color: var(--accent-rose); box-shadow: var(--shadow-rose); }

  /* ============================================================
     MODAL
  ============================================================ */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,4,20,0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: linear-gradient(135deg, #2d1454, #3a1a6e);
    border: 1px solid var(--border-gold);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 560px;
    width: 100%;
    box-shadow: var(--shadow-gold), 0 20px 60px rgba(0,0,0,0.7);
    position: relative;
    animation: modalIn 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes modalIn {
    from { transform: scale(0.8) translateY(-20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-title {
    font-family: var(--font-title);
    font-size: 1.5rem;
    color: var(--accent-gold);
    margin-bottom: 16px;
    text-align: center;
    letter-spacing: 2px;
  }

  .modal-body { color: var(--text-secondary); line-height: 1.7; margin-bottom: 20px; }

  .modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ============================================================
     PUNISHMENT BANNER
  ============================================================ */
  .punishment-banner {
    background: linear-gradient(135deg, rgba(139,32,48,0.9), rgba(200,80,106,0.8));
    border: 1px solid var(--accent-rose);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 12px 0;
    text-align: center;
    box-shadow: var(--shadow-rose);
    animation: pulse-rose 2s infinite;
  }

  @keyframes pulse-rose {
    0%, 100% { box-shadow: 0 0 10px rgba(200,80,106,0.4); }
    50% { box-shadow: 0 0 25px rgba(200,80,106,0.8); }
  }

  .punishment-banner .p-title {
    font-family: var(--font-title);
    font-size: 1.1rem;
    color: var(--accent-gold-light);
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  /* ============================================================
     CATEGORY TOGGLES IN ROUND
  ============================================================ */
  .cat-toggle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }

  .cat-toggle-item {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(212,175,55,0.2);
    background: rgba(26,10,46,0.5);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .cat-toggle-item.enabled {
    border-color: var(--accent-gold);
    background: rgba(212,175,55,0.1);
    color: var(--text-primary);
  }

  .cat-toggle-item .cat-dot {
    width: 10px; height: 10px;
